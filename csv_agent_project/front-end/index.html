<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Viewport otimizado -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- ✅ DNS prefetch para fontes -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    
    <!-- ✅ Preconnect para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- ✅ Font loading otimizado -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" 
      rel="stylesheet"
    >
    
    <!-- ✅ Meta tags para SEO e performance -->
    <meta name="description" content="Sistema de IA G.A.I.A">
    <meta name="theme-color" content="#14b8a6">
    
    <!-- ✅ Preload para recursos críticos -->
    <link rel="modulepreload" href="/src/main.tsx">
    
    <title>G.A.I.A</title>
    
    <!-- ✅ Critical CSS inline (opcional) -->
    <style>
      /* Critical CSS para LCP */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading skeleton para melhor UX */
      .loading-skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- ✅ Loading skeleton para melhor LCP -->
      <div class="loading-skeleton" style="height: 100vh; width: 100%;"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
