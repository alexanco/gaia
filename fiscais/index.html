<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente de Notas Fiscais</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-receipt"></i>
                    <h1>Agente de Notas Fiscais</h1>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="message-content">
                        <h3>Bem-vindo ao Agente de Notas Fiscais!</h3>
                        <p>Olá! Sou seu assistente especializado em análise de notas fiscais. Posso ajudá-lo com informações sobre valores totais, produtos, fornecedores e muito mais.</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="sendSuggestion('Qual é o valor total de todas as notas fiscais?')">
                                Valor total das notas
                            </button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Quantas notas fiscais foram emitidas este mês?')">
                                Notas do mês
                            </button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Quais são os principais fornecedores?')">
                                Principais fornecedores
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Digite sua pergunta sobre notas fiscais..."
                        maxlength="500"
                    >
                    <button id="sendButton" class="send-button" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="char-counter">
                        <span id="charCount">0</span>/500
                    </span>
                </div>
            </div>
        </main>

        <!-- Error Modal -->
        <div class="modal" id="errorModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-exclamation-triangle"></i> Erro</h3>
                    <button class="close-btn" onclick="closeErrorModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage">Ocorreu um erro inesperado.</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="closeErrorModal()">
                        Entendi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
